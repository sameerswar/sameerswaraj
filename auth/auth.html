<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign In | sameerswaraj.in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      radial-gradient(circle at top left,#1e3a8a 0%,transparent 35%),
      radial-gradient(circle at bottom right,#7c3aed 0%,transparent 35%),
      #0f172a;

      font-family:'Poppins',sans-serif;
      overflow:hidden;
      padding:20px;
    }

    .bg-blur{
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      background:#3b82f6;
      filter:blur(140px);
      opacity:.18;
      top:-120px;
      left:-120px;
    }

    .bg-blur2{
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      background:#8b5cf6;
      filter:blur(140px);
      opacity:.18;
      bottom:-120px;
      right:-120px;
    }

    .login-card{
      position:relative;
      z-index:2;
      width:100%;
      max-width:430px;

      background:rgba(255,255,255,.08);
      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,.12);

      border-radius:28px;
      padding:45px 35px;

      box-shadow:
      0 10px 40px rgba(0,0,0,.35);

      text-align:center;
    }

    .logo{
      width:78px;
      height:78px;
      margin:auto;
      margin-bottom:20px;

      border-radius:22px;

      background:linear-gradient(135deg,#2563eb,#7c3aed);

      display:flex;
      align-items:center;
      justify-content:center;

      color:#fff;
      font-size:34px;
      font-weight:700;

      box-shadow:0 10px 25px rgba(59,130,246,.35);
    }

    h1{
      color:#fff;
      font-size:30px;
      font-weight:600;
      margin-bottom:10px;
    }

    p{
      color:rgba(255,255,255,.7);
      font-size:15px;
      line-height:1.6;
      margin-bottom:35px;
    }

    .google-btn{
      width:100%;
      height:58px;

      border:none;
      outline:none;

      border-radius:18px;

      background:#fff;
      color:#111827;

      font-size:16px;
      font-weight:600;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;

      cursor:pointer;

      transition:.25s ease;
    }

    .google-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(255,255,255,.15);
    }

    .google-btn:active{
      transform:scale(.98);
    }

    .google-icon{
      width:22px;
      height:22px;
    }

    .footer{
      margin-top:28px;
      color:rgba(255,255,255,.5);
      font-size:13px;
    }

    @media(max-width:500px){

      .login-card{
        padding:38px 24px;
        border-radius:24px;
      }

      h1{
        font-size:26px;
      }

      p{
        font-size:14px;
      }

    }
  </style>
</head>

<body>

  <div class="bg-blur"></div>
  <div class="bg-blur2"></div>

  <div class="login-card">

    <div class="logo">
      S
    </div>

    <h1>Welcome Back</h1>

    <p>
      Sign in securely with your Google account to continue to
      <strong>sameerswaraj.in</strong>
    </p>

    <button class="google-btn" onclick="loginGoogle()">

      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.4 5.4-6.5 6.9l6.2 5.2C39.6 36.3 44 30.7 44 24c0-1.3-.1-2.3-.4-3.5z"/>
      </svg>

      Continue with Google

    </button>

    <div class="footer">
      Secure Authentication • Firebase Powered
    </div>

  </div>

  <script type="module" src="auth.js"></script>

</body>
</html>
