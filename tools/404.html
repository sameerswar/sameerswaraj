<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f172a;
  font-family:Arial,sans-serif;
  overflow:hidden;
  color:white;
}

.container{
  text-align:center;
  z-index:2;
}

h1{
  font-size:120px;
  color:#38bdf8;
  text-shadow:0 0 20px #38bdf8;
}

p{
  font-size:22px;
  margin-top:10px;
  color:#cbd5e1;
}

a{
  display:inline-block;
  margin-top:30px;
  padding:14px 28px;
  border-radius:10px;
  background:#38bdf8;
  color:#000;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

a:hover{
  transform:scale(1.1);
  background:white;
}

.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(56,189,248,0.15);
  animation:float 8s infinite linear;
}

.circle:nth-child(1){
  width:200px;
  height:200px;
  left:10%;
  top:20%;
}

.circle:nth-child(2){
  width:300px;
  height:300px;
  right:10%;
  bottom:10%;
  animation-duration:12s;
}

@keyframes float{
  0%{
    transform:translateY(0px) rotate(0deg);
  }
  50%{
    transform:translateY(-30px) rotate(180deg);
  }
  100%{
    transform:translateY(0px) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>

<div class="container">
  <h1>404</h1>
  <p>Page not found</p>

  <!-- Replace myproject with your repo name -->
  <a href="../index.html">Go Home</a>
</div>

</body>
</html>
