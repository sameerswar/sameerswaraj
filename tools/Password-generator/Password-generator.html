<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.box{
    width:320px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    animation:pop 0.4s ease;
}

@keyframes pop{
    from{transform:scale(0.8); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

h2{
    margin-bottom:15px;
    color:#333;
}

/* INPUT */
input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1.5px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:16px;
    text-align:center;
}

input:focus{
    border-color:#6c63ff;
}

/* BUTTON */
button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#6c63ff;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#574fd6;
}

/* RESULT */
.result{
    margin-top:15px;
    padding:12px;
    background:#f4f4f4;
    border-radius:10px;
    font-weight:bold;
    word-break:break-all;
}

.copy{
    margin-top:10px;
    font-size:13px;
    color:green;
    display:none;
}

</style>
</head>

<body>
    <script src="../../splash/globalsplash.js"></script>
  <div id="header-box"></div>

<div class="box">
    <h2>🔐 Password Generator</h2>

    <input type="number" id="length" placeholder="Enter password length">

    <button onclick="generate()">Generate Password</button>

    <div class="result" id="result">Your password will appear here</div>

    <div class="copy" id="copyMsg">Copied!</div>
</div>

<script>

function generate(){

    let len = parseInt(document.getElementById("length").value);

    let result = document.getElementById("result");

    if(!len || len < 4){
        result.innerText = "Minimum length is 4";
        return;
    }

    if(len > 80){
        result.innerText = "Maximum length is 80";
        return;
    }

    let small = "abcdefghijklmnopqrstuvwxyz";
    let caps = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let numbers = "0123456789";
    let special = "!@#₹%^&*()-_=+[]{};:,.<>?/";

    let groups = [
        {type:"small", chars:small},
        {type:"caps", chars:caps},
        {type:"numbers", chars:numbers},
        {type:"special", chars:special}
    ];

    let used = new Set();

    function pickUnique(str){

        let ch;

        do{
            ch = str[Math.floor(Math.random() * str.length)];
        }while(used.has(ch));

        used.add(ch);

        return ch;
    }

    // equal distribution
    let each = Math.floor(len / 4);

    let extra = len % 4;

    let counts = {
        small:each,
        caps:each,
        numbers:each,
        special:each
    };

    // distribute remaining
    let order = ["small","caps","numbers","special"];

    for(let i=0;i<extra;i++){
        counts[order[i]]++;
    }

    let password = "";

    let lastType = "";

    while(password.length < len){

        let available = groups.filter(g =>
            counts[g.type] > 0 &&
            g.type !== lastType
        );

        let chosen = available[
            Math.floor(Math.random() * available.length)
        ];

        let ch = pickUnique(chosen.chars);

        password += ch;

        counts[chosen.type]--;

        lastType = chosen.type;
    }

    result.innerText = password;

    navigator.clipboard.writeText(password);

    let msg = document.getElementById("copyMsg");

    msg.style.display = "block";

    setTimeout(()=>{
        msg.style.display = "none";
    },1500);
}


//universal header

fetch('/home/universalheader.html')
.then(res => res.text())
.then(data=>{
document.getElementById("header-box").innerHTML=data;
});
//universal header
</script>

</body>
</html>
